name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 1.3"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          TAG="v${VERSION}"
          APK="apk/FubarAlphaFoxtrot-${VERSION}.apk"
          test -f "$APK"
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Fubar Alpha Foxtrot ${VERSION}" \
            --notes-file "release-notes/${TAG}.md"
